<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ARICRAFT 13 Światów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0d1330;
  --plate:#1a2257;
  --plate2:#232d6e;
  --stud:rgba(255,255,255,.055);
  --text:#f5f7ff;
  --muted:#b7bfe8;
  --red:#e3342f;
  --yellow:#ffc425;
  --blue:#2e86de;
  --green:#2fbf71;
  --ink:#1b1b2f;
  --font:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --page:#c9d6ff; }
}
:root[data-theme="dark"]{ --page:#0d1330; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,calc(100vh * 16 / 9));width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9;container-type:size;background:#000;overflow:hidden;font-size:clamp(11px,1.75cqw,22px);box-shadow:0 1.5cqw 4cqw rgba(0,0,0,.45)}
@media (min-width:1100px){#game{border-radius:14px}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:2.4cqw 3cqw;
  background-color:rgba(18,24,66,.9);
  background-image:radial-gradient(circle at 50% 50%,var(--stud) 0 28%,transparent 30%);
  background-size:2.6cqw 2.6cqw;touch-action:pan-y}
.screen.on{display:block}
.screen.clear{background:rgba(10,14,40,.35);background-image:none}
h1,h2,h3{margin:0;font-weight:800;line-height:1.05}
h2{font-size:2.1em;margin-bottom:.35em}
h3{font-size:1.2em;margin:.5em 0 .3em}
p{margin:.3em 0;line-height:1.35;max-width:62ch}
.muted{color:var(--muted)}
.row{display:flex;gap:.8em;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:1em;flex-wrap:wrap}

/* brick buttons: a stud row sits on top of every button */
.btn{position:relative;font:inherit;font-weight:800;font-size:1.05em;border:0;border-radius:.35em;padding:.55em 1.3em .45em;margin-top:.45em;
  background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:inset 0 -.28em 0 rgba(0,0,0,.22);transition:transform .08s}
.btn::before{content:"";position:absolute;left:.5em;right:.5em;top:-.42em;height:.45em;
  background:radial-gradient(ellipse at 50% 100%,currentColor 0 0) ;
  background:radial-gradient(circle at center, var(--btnc,var(--yellow)) 0 .32em, transparent .34em) 0 0/1.25em .9em repeat-x;opacity:1}
.btn{--btnc:var(--yellow)}
.btn.red{background:var(--red);--btnc:var(--red);color:#fff}
.btn.blue{background:var(--blue);--btnc:var(--blue);color:#fff}
.btn.green{background:var(--green);--btnc:var(--green);color:#fff}
.btn.dark{background:var(--plate2);--btnc:var(--plate2);color:var(--text)}
.btn:hover{transform:translateY(-.1em)}
.btn:active{transform:translateY(.12em)}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:not-allowed;transform:none}
.btn.big{font-size:1.45em;padding:.5em 1.6em .4em}
.btn.sm{font-size:.9em;padding:.35em .9em .3em}
button:focus-visible,input:focus-visible{outline:.18em solid #fff;outline-offset:.15em}

/* title */
#scTitle{display:none;text-align:center;background:linear-gradient(180deg,rgba(13,19,48,.2),rgba(13,19,48,.75));background-size:auto}
#scTitle.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.logoimg{width:min(34cqw,520px);aspect-ratio:1/1;object-fit:contain;display:block;margin:-2cqw 0 -4cqw;
  -webkit-mask-image:radial-gradient(closest-side,#000 58%,rgba(0,0,0,.65) 76%,transparent 97%);
  mask-image:radial-gradient(closest-side,#000 58%,rgba(0,0,0,.65) 76%,transparent 97%);
  filter:drop-shadow(0 .6cqw 1.2cqw rgba(0,0,0,.55))}
#scTitle{background:radial-gradient(circle at 50% 38%,rgba(8,6,22,.82),rgba(13,19,48,.55) 45%,rgba(13,19,48,.8))!important}
.logo{display:flex;flex-direction:column;align-items:center;gap:.25em;margin-bottom:.6em}
.logo .line{display:flex;gap:.18em}
.brick{position:relative;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;
  font-size:3.4em;line-height:1;padding:.14em .16em .06em;min-width:.9em;border-radius:.08em;
  box-shadow:inset 0 -.1em 0 rgba(0,0,0,.25),0 .08em 0 rgba(0,0,0,.35);text-shadow:0 .05em 0 rgba(0,0,0,.3)}
.brick::before{content:"";position:absolute;top:-.12em;left:50%;width:.36em;height:.14em;margin-left:-.18em;border-radius:.05em .05em 0 0;background:inherit;box-shadow:inset 0 .03em 0 rgba(255,255,255,.25)}
.logo .num .brick{font-size:4.6em}
.logo .small .brick{font-size:2em}
.credit{font-size:1.05em;color:#fff;opacity:.9;margin:.2em 0 1em}

/* creator */
.create{display:grid;grid-template-columns:34% 1fr;gap:2.5cqw;min-height:100%}
.preview{background:rgba(0,0,0,.25);border-radius:.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1em}
.preview canvas{position:static;width:100%;height:auto;aspect-ratio:1}
.opts label.cap{display:block;font-weight:700;margin:.5em 0 .2em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.35em}
.chip{font:inherit;font-weight:700;border:.14em solid transparent;background:var(--plate2);color:var(--text);border-radius:.4em;padding:.2em .7em;cursor:pointer}
.chip.on{border-color:var(--yellow);background:#394697}
.sw{width:1.9em;height:1.9em;border-radius:.35em;border:.16em solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 .14em var(--yellow)}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.clsCard{font:inherit;text-align:left;background:var(--plate2);color:var(--text);border:.16em solid transparent;border-radius:.5em;padding:.5em .7em;cursor:pointer}
.clsCard.on{border-color:var(--yellow);background:#394697}
.clsCard b{display:block;font-size:1.15em}
.clsCard small{color:var(--muted);line-height:1.2;display:block}
input.name{font:inherit;font-weight:700;font-size:1.1em;background:#0e1440;color:#fff;border:.14em solid #3b479a;border-radius:.4em;padding:.25em .6em;width:12em}

/* map */
.mapTop{display:flex;justify-content:space-between;align-items:flex-start;gap:1em;flex-wrap:wrap;margin-bottom:.6em}
.gems{display:flex;gap:.25em;align-items:center}
.gem{width:1.05em;height:1.35em;clip-path:polygon(50% 0,100% 30%,80% 100%,20% 100%,0 30%);background:#2c356f}
.gem.on{box-shadow:none}
.worlds{display:grid;grid-template-columns:repeat(5,1fr);gap:.7em}
.wcard{font:inherit;position:relative;text-align:left;color:#fff;border:0;border-radius:.5em;padding:.5em .6em .45em;cursor:pointer;min-height:5.6em;
  box-shadow:inset 0 -.3em 0 rgba(0,0,0,.28);overflow:hidden}
.wcard .no{position:absolute;right:.35em;top:.05em;font-size:2.2em;font-weight:800;opacity:.28}
.wcard .ic{font-size:1.6em;line-height:1}
.wcard b{display:block;font-size:1.05em;line-height:1.1;margin-top:.15em}
.wcard small{display:block;opacity:.85;line-height:1.15}
.wcard .st{position:absolute;right:.45em;bottom:.3em;font-size:1.1em}
.wcard.locked{filter:grayscale(.9) brightness(.55);cursor:not-allowed}
.wcard.next{outline:.2em solid var(--yellow);outline-offset:.1em;animation:pulse 1.4s ease-in-out infinite}
.wcard.final{grid-column:span 2}
@keyframes pulse{50%{outline-color:rgba(255,196,37,.25)}}
@media (prefers-reduced-motion:reduce){.wcard.next{animation:none}}
.badge{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:800;border-radius:.3em;padding:0 .5em}

/* shop & powers */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em}
.item{background:var(--plate2);border-radius:.5em;padding:.5em .7em;border:.16em solid transparent;display:flex;flex-direction:column;gap:.2em}
.item.on{border-color:var(--yellow)}
.item b{font-size:1.05em;line-height:1.1}
.item small{color:var(--muted);line-height:1.2}
.item .btn{align-self:flex-start;margin-top:auto}
.pw{font:inherit;color:#fff;text-align:left;background:var(--plate2);border:.16em solid transparent;border-radius:.5em;padding:.45em .6em;cursor:pointer;display:flex;gap:.5em;align-items:center}
.pw .e{font-size:1.8em}
.pw b{display:block;line-height:1.1}
.pw small{color:var(--muted);line-height:1.15;display:block}
.pw.on{border-color:var(--yellow);background:#394697}
.pw.lock{opacity:.35;cursor:default}
.shopHead{display:grid;grid-template-columns:auto 1fr auto;gap:1.2em;align-items:center;margin-bottom:.4em}
.shopHead canvas{position:static;width:7em;height:7em}
.coins{font-weight:800;font-size:1.25em;color:var(--yellow)}

/* message */
#scMsg.on{display:flex;align-items:center;justify-content:center}
.msg{background:var(--plate);border-radius:.8em;padding:1.4em 1.8em;max-width:40em;text-align:center;box-shadow:0 .5em 0 rgba(0,0,0,.3)}
.msg .bigic{font-size:3.2em;line-height:1.1}
.msg p{margin:.4em auto}
.msg .row{justify-content:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.25em 1em;text-align:left;margin:.6em auto;max-width:32em}
kbd{font:inherit;font-weight:700;background:#0e1440;border:.1em solid #45519f;border-bottom-width:.2em;border-radius:.3em;padding:0 .4em}

/* in-game HUD */
#hudPowers{position:absolute;left:50%;bottom:1.2cqw;transform:translateX(-50%);display:none;gap:.5cqw}
#hudPowers.on{display:flex}
.pb{position:relative;width:5.2cqw;height:5.2cqw;border-radius:.6cqw;border:.25cqw solid rgba(255,255,255,.55);background:rgba(10,14,40,.6);color:#fff;font-size:2.6cqw;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;overflow:hidden;touch-action:none}
.pb .k{position:absolute;left:.3cqw;top:0;font-size:1.1cqw;font-weight:800;opacity:.85}
.pb .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65)}
.pb.ready{border-color:#ffe27a}
#pauseBtn{position:absolute;right:1.2cqw;top:1.1cqw;width:4.2cqw;height:4.2cqw;border-radius:.6cqw;border:0;background:rgba(10,14,40,.55);color:#fff;font-size:2cqw;font-weight:800;display:none;cursor:pointer}
#pauseBtn.on{display:block}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{pointer-events:auto;position:absolute;width:8.4cqw;height:8.4cqw;border-radius:50%;background:rgba(10,14,40,.35);border:.3cqw solid rgba(255,255,255,.75);text-shadow:0 1px 2px #000;color:#fff;font-size:2.8cqw;font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none;font-family:var(--font)}
.tb.act{background:rgba(255,196,37,.45)}
@media (max-width:700px){ .worlds{grid-template-columns:repeat(4,1fr)} .create{grid-template-columns:30% 1fr} }
</style>
</head>
<body>
<div id="app">
 <div id="game">
  <canvas id="cv" width="960" height="540" aria-label="Plansza gry"></canvas>
  <div id="hudPowers"></div>
  <button id="pauseBtn" aria-label="Pauza">II</button>
  <div id="touch">
   <div class="tb" data-k="left" style="left:2cqw;bottom:3cqw">◀</div>
   <div class="tb" data-k="right" style="left:12.5cqw;bottom:3cqw">▶</div>
   <div class="tb" data-k="up" style="left:7.25cqw;bottom:12.2cqw">▲</div>
   <div class="tb" data-k="down" style="left:7.25cqw;bottom:-5.5cqw;opacity:0">▼</div>
   <div class="tb" data-k="jump" style="right:2.5cqw;bottom:4cqw;width:10cqw;height:10cqw;font-size:2cqw">SKOK</div>
   <div class="tb" data-k="attack" style="right:14cqw;bottom:2.5cqw;font-size:1.8cqw">CIOS</div>
  </div>
  <div class="screen" id="scTitle"></div>
  <div class="screen" id="scCreate"></div>
  <div class="screen" id="scMap"></div>
  <div class="screen" id="scShop"></div>
  <div class="screen" id="scLoadout"></div>
  <div class="screen clear" id="scMsg"></div>
 </div>
</div>
<script>
'use strict';
const W=960,H=540,FLOOR=460,PW=26,PH=44,RUN=250,JUMPV=720,GRAV=1900;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);

const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function rngFrom(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shade(hex,a){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);
  const f=v=>clamp(Math.round(v+a),0,255);return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`}

 {name:'Mega trudny',desc:'Największe wyzwanie dla mistrzów gry',hp:0,dmg:2,boss:1.8,speed:1.3},

 inventor:{name:'Wynalazca',desc:'Specjalista od mocy: moce ładują się szybciej, kula energii jest mocniejsza.',icon:'🔧',speed:1,jump:1,hp:4,cd:0.6,orb:2},

 laser:{name:'Laser',icon:'🔴',desc:'Promień, który przebija wszystko na drodze.',cd:5},

 slow:{name:'Spowolnienie czasu',icon:'⏳',desc:'Wrogowie zwalniają na 5 sekund.',cd:15},
};

  ground:'#5b6378',top:'#8d97ad',spike:'#ff3b5c',pit:'void',en:['walker','shooter','flyer'],skin:'robot',
  segs:['flat','laser','moving','gap','laser','steps'],crystal:'#ff4df0'},

const SFX={jump:[520,820,.11,'square',.05],coin:[900,1500,.09,'triangle',.07],hit:[240,90,.14,'sawtooth',.07],hurt:[380,110,.3,'square',.07],
 power:[420,950,.18,'sine',.09],boss:[110,55,.6,'sawtooth',.09],win:[523,1046,.6,'triangle',.1],stomp:[260,520,.1,'square',.06],

function sfx(k){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const p=SFX[k];if(!p)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=p[3];
  o.frequency.setValueAtTime(p[0],t);o.frequency.exponentialRampToValueAtTime(p[1],t+p[2]);g.gain.setValueAtTime(p[4],t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+p[2]+.03)}catch(e){}}
function jingle(notes){if(muted)return;notes.forEach((n,i)=>setTimeout(()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='triangle';o.frequency.value=n;g.gain.setValueAtTime(.08,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.27)}catch(e){}},i*130))}

  if(running&&(e.code in KMAP||/^Digit[1-6]$/.test(e.code)))e.preventDefault();

  if(e.code in KMAP)press(KMAP[e.code]);

  if((e.code==='Escape'||e.code==='KeyP')&&running)pauseGame();
});

document.querySelectorAll('#touch .tb').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();press(k);b.classList.add('act')};
  const off=e=>{e.preventDefault();release(k);b.classList.remove('act')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);

function genOcean(L,R){

      for(let i=0;i<4;i++)L.coins.push({x:x+wd/2-70+i*45,y:gy-60,t:R()*6});}
    else if(s==='urchin'){L.haz.push({k:'urchin',x:x+wd/2-40,y:gy-24,w:80,h:24});
      for(let i=0;i<5;i++)L.coins.push({x:x+wd/2-80+i*40,y:gy-110,t:R()*6});mkEnemy(L,'jelly',x+wd/2,gy-200,{cx:x+wd/2,cy:gy-200,range:40});}
    else if(s==='tunnel'){const top=gy-130;L.solids.push({x:x+60,y:-300,w:wd-120,h:top+300,k:'rock'});
      for(let i=0;i<Math.floor((wd-120)/45);i++)L.coins.push({x:x+80+i*45,y:gy-60,t:R()*6});
      mkEnemy(L,'swimmer',x+wd/2,gy-70,{cx:x+wd/2,cy:gy-70,range:(wd-200)/2});}
    x+=wd;
  }
  gy=440;ground(x,900,gy);L.gate={x:x+420,y:gy-120,w:80,h:120};L.end=x+900;
  return L;
}
function genArena(wi){
  const w=WORLDS[wi],L=baseLevel(wi);L.arena=true;L.end=W;
  L.solids.push({x:-200,y:FLOOR,w:W+400,h:300,k:'ground'});
  L.solids.push({x:-100,y:-600,w:100,h:1400,k:'wall'},{x:W,y:-600,w:100,h:1400,k:'wall'});
  L.plats.push({x:140,y:325,w:160,h:14},{x:W-300,y:325,w:160,h:14});

let G=null,running=false,paused=false;
function mkPlayer(){return{x:0,y:0,w:PW,h:PH,vx:0,vy:0,dir:1,onG:false,gref:null,jumps:0,coyote:0,hp:maxHp(),inv:0,fly:0,shield:0,
  dash:0,root:0,climb:false,atkT:0,atkCd:0,hitSet:new Set(),run:0,safe:{x:90,y:300},inWater:false,air:0}}

/* ---------- kolizje ---------- */
function moveBody(b,L,dx,dy){
  b.hitWall=false;
  if(dx){b.x+=dx;for(const s of L.solids){if(overlap(b,s)){if(dx>0)b.x=s.x-b.w;else b.x=s.x+s.w;b.vx=0;b.hitWall=true}}}
  const prevBottom=b.y+b.h;
  b.y+=dy;b.onG=false;b.gref=null;
  for(const s of L.solids){if(overlap(b,s)){if(dy>0){b.y=s.y-b.h;b.onG=true;b.gref=s}else if(dy<0){b.y=s.y+s.h}b.vy=0}}
  if(dy>=0){for(const arr of [L.plats,L.movers,L.crumbles])for(const s of arr){if(s.st>=2)continue;
    if(b.x+b.w>s.x+3&&b.x<s.x+s.w-3&&prevBottom<=s.y+2&&b.y+b.h>=s.y){b.y=s.y-b.h;b.vy=0;b.onG=true;b.gref=s}}}
}

/* ---------- gracz ---------- */
function meleeBox(){const p=G.p,r=S.sword?66:42;return{x:p.dir>0?p.x+p.w-6:p.x-r+6,y:p.y+4,w:r,h:36}}
function meleeDmg(){return (S.sword?3:1)+(S.owned.u_hit?1:0)}
function updPlayer(dt){
  const p=G.p,L=G.L,c=CL();
  if(p.gref&&p.gref.dx!==undefined){p.x+=p.gref.dx;p.y+=p.gref.dy}
  const ax=(KEY.right?1:0)-(KEY.left?1:0);
  if(ax&&p.dash<=0)p.dir=ax;
  p.inv=Math.max(0,p.inv-dt);p.fly-=dt;p.shield-=dt;p.root-=dt;p.atkCd-=dt;p.atkT-=dt;
  const cx=p.x+p.w/2,cy=p.y+p.h/2;
  let water=null,quick=null,vine=null,wx=0,wy=0,whirl=null;
  for(const z of L.zones){if(cx>z.x&&cx<z.x+z.w&&cy>z.y&&cy<z.y+z.h){
    if(z.k==='water')water=z;else if(z.k==='quick')quick=z;else if(z.k==='vine')vine=z;else if(z.k==='wind'){wx+=z.fx||0;wy+=z.fy||0}else if(z.k==='whirl')whirl=z}}
  p.inWater=!!water;
  const g=GRAV*L.grav,speed=RUN*c.speed*(p.root>0?0:1),lowG=L.grav<1?0.72:1;
  if(PRESS.attack&&p.atkCd<=0&&p.root<=0){p.atkT=.16;p.atkCd=.3;p.hitSet=new Set();sfx('swing')}
  if(p.dash>0){p.dash-=dt;p.vx=p.dir*1000;p.vy=0;moveBody(p,L,p.vx*dt,0);addPart(p.x+p.w/2,p.y+p.h/2,'#ffe27a',1,.25);return}
  if(vine&&(KEY.up||KEY.down)&&p.fly<=0)p.climb=true;
  if(!vine)p.climb=false;
  let dxExtra=wx,dyExtra=0;
  if(whirl){dxExtra+=Math.sign(whirl.cx-cx)*110;dyExtra+=Math.sign(whirl.cy-cy)*90;if(Math.random()<.3)addPart(whirl.cx+(Math.random()-.5)*160,whirl.cy+(Math.random()-.5)*200,'rgba(255,255,255,.6)',1,.5)}
  if(p.climb){
    p.vx=ax*120;p.vy=(KEY.up?-190:0)+(KEY.down?190:0);p.jumps=0;
    if(PRESS.jump){p.climb=false;p.vy=-JUMPV*.85*c.jump;p.jumps=1;sfx('jump')}
  }else if(p.fly>0){
    p.vx=lerp(p.vx,ax*speed*1.1,Math.min(1,10*dt));
    p.vy=lerp(p.vy,((KEY.up||KEY.jump)?-270:0)+(KEY.down?270:0),Math.min(1,8*dt));
    if(Math.random()<.4)addPart(p.x+p.w/2,p.y+p.h,'#fff6c7',1,.35);
  }else if(water){
    p.vx=lerp(p.vx,ax*speed*.78,Math.min(1,6*dt));
    p.vy+=380*dt;if(KEY.up||KEY.jump)p.vy-=1250*dt;if(KEY.down)p.vy+=700*dt;
    p.vy=clamp(p.vy,-270,230);
    if((PRESS.jump||PRESS.up)&&p.root<=0){if(p.y<water.y+6)p.vy=-JUMPV*.92*c.jump;else p.vy=Math.min(p.vy,-250);sfx('swim');
      for(let i=0;i<3;i++)addPart(p.x+p.w/2,p.y,'rgba(220,245,255,.8)',1,.6,-40)}
    p.jumps=1;p.coyote=0;
  }else{
    const onIce=L.ice&&p.onG,acc=onIce?2.2:(p.onG?16:9);
    let target=ax*speed;if(quick)target*=.45;
    p.vx=lerp(p.vx,target,Math.min(1,acc*dt));
    p.vy+=g*dt;if(wy){p.vy+=wy*dt;p.vy=Math.max(p.vy,-330)}
    p.vy=Math.min(p.vy,quick?60:950);
    if(p.onG){p.coyote=.1;p.jumps=0}else p.coyote-=dt;
    const jp=PRESS.jump||(PRESS.up&&!vine);
    if(jp&&p.root<=0){
      if(quick){p.vy=-JUMPV*.85;sfx('jump')}
      else if(p.coyote>0){p.vy=-JUMPV*c.jump*lowG;p.coyote=0;p.jumps=1;sfx('jump')}
      else if(p.jumps<2){p.vy=-JUMPV*.8*c.jump*lowG;p.jumps=2;sfx('jump');for(let i=0;i<6;i++)addPart(p.x+p.w/2,p.y+p.h,'#ffffff',1,.35)}
    }
    if(!KEY.jump&&!KEY.up&&p.vy<-200&&!wy)p.vy+=g*dt*1.3;
  }
  moveBody(p,L,(p.vx+dxExtra)*dt,(p.vy+dyExtra)*dt);
  if(L.arena)p.x=clamp(p.x,0,W-p.w);else p.x=Math.max(p.x,0);
  if(p.y<-80&&!water)p.y=-80;
  p.run+=Math.abs(p.vx)*dt*.06;p.air=p.onG?0:p.air+dt;
  // bezpieczne miejsce do powrotu
  if(p.onG&&p.gref&&p.gref.k==='ground'&&!quick&&p.inv<=0){
    const s=p.gref;let ok=true;for(const h of L.haz){if(h.x<p.x+110&&h.x+h.w>p.x-110&&(h.k!=='lava'&&h.k!=='pitspikes'))ok=false}
    for(const m of L.enemies){if(m.alive&&Math.abs(m.x-p.x)<90)ok=false}
    if(ok&&s.w>70)p.safe={x:clamp(p.x,s.x+8,s.x+s.w-p.w-8),y:s.y-p.h};
  }
  if(p.y>H+60)fallHurt();
  else if(quick&&p.y>quick.y+6)fallHurt();
}
function hurt(n,srcX){
  const p=G.p;if(G.over||p.inv>0||p.shield>0||p.dash>0)return;
  p.hp-=n;p.inv=1.3;p.vy=-380;p.vx=(p.x+p.w/2<srcX?-1:1)*260;p.climb=false;G.shake=.3;sfx('hurt');
  G.texts.push({x:p.x+p.w/2,y:p.y,txt:'-'+n,col:'#ff6b6b',t:1});
  if(p.hp<=0)die();
}
function fallHurt(){
  const p=G.p;if(G.over)return;p.hp-=1;sfx('hurt');G.shake=.3;
  if(p.hp<=0){die();p.y=H+200;return}
  p.x=p.safe.x;p.y=p.safe.y;p.vx=p.vy=0;p.inv=1.6;p.climb=false;p.fly=0;
}
function die(){G.over=true;G.endT=1.3;G.p.hp=0}

/* ---------- efekty ---------- */
function addPart(x,y,col,n=1,life=.6,vy0=0,spd=120){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd;
  G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+vy0,col,life,max:life,sz:2+Math.random()*4})}}
function burst(x,y,col,n=14){addPart(x,y,col,n,.7,-60,260)}
function addCoins(n,x,y){S.coins+=n;G.coinsRun+=n;G.texts.push({x,y,txt:'+'+n,col:'#ffd23f',t:.8});sfx('coin')}

/* ---------- moce ---------- */
function shoot(o){G.proj.push(Object.assign({life:1.3,r:9,dmg:1,col:'#6fd3ff'},o))}
function usePower(i){
  if(!G||paused||G.over||!running)return;const id=S.loadout[i];if(!id)return;if((G.cds[id]||0)>0)return;
  const p=G.p,cx=p.x+p.w/2,cy=p.y+p.h/2-4,b=G.boss&&!G.boss.dead?G.boss:null;
  const bdist=b?Math.hypot(b.x+b.w/2-cx,b.y+b.h/2-cy):9999;
  switch(id){
    case 'orb':shoot({x:cx+p.dir*14,y:cy,vx:p.dir*560,vy:0,r:9,dmg:CL().orb,col:'#6fd3ff'});break;
    case 'fire':shoot({x:cx+p.dir*14,y:cy,vx:p.dir*470,vy:0,r:15,dmg:3,col:'#ff7a1a',life:1.5,fire:true});break;
    case 'ice':shoot({x:cx+p.dir*14,y:cy,vx:p.dir*600,vy:0,r:10,dmg:1,freeze:3,col:'#c9f6ff'});break;
    case 'push':
      G.fx.push({k:'ring',x:cx,y:cy,t:0,max:.4,r:180,col:'rgba(220,240,255,'});
      for(const e of G.L.enemies)if(e.alive&&Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<180){dmgEnemy(e,1);const d=Math.sign(e.x-cx)||1;
        if(e.k==='walker'||e.k==='hopper')e.x=clamp(e.x+d*90,e.x0,e.x1);else e.cx+=d*90}
      G.eproj=G.eproj.filter(q=>Math.hypot(q.x-cx,q.y-cy)>200);
      if(b&&bdist<240){hitBoss(1);if(b.state==='tele'||b.state==='act'){b.state='move';b.t=0;b.vy=0;b.alpha=1;if(!b.fly)b.y=FLOOR-b.h}
        b.x=clamp(b.x+Math.sign(b.x+b.w/2-cx)*70,10,W-10-b.w)}
      break;
    case 'fly':p.fly=4;p.climb=false;break;
    case 'shield':p.shield=5;break;
    case 'dash':p.dash=.2;p.inv=Math.max(p.inv,.35);break;
    case 'sand':
      G.fx.push({k:'sand',x:cx,y:cy,t:0,max:.8});
      for(const e of G.L.enemies)if(e.alive&&Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<290)dmgEnemy(e,2);
      if(b&&bdist<320)hitBoss(2);break;
    case 'laser':{
      G.beam={x:cx,y:cy,dir:p.dir,t:.3};
      const r={x:p.dir>0?cx:cx-900,y:cy-14,w:900,h:28};
      for(const e of G.L.enemies)if(e.alive&&overlap(r,{x:e.x,y:e.y+e.hy,w:e.w,h:e.h}))dmgEnemy(e,2);
      if(b&&overlap(r,b))hitBoss(2);break}
    case 'heal':p.hp=Math.min(maxHp(),p.hp+1);burst(cx,cy,'#ff6b8a',12);break;
    case 'crystal':
      for(let i=0;i<24;i++)G.fx.push({k:'shard',x:G.cam+Math.random()*W,y:-Math.random()*200,vy:500+Math.random()*300,t:0,max:1.4});
      for(const e of G.L.enemies)if(e.alive&&e.x>G.cam-40&&e.x<G.cam+W+40)dmgEnemy(e,2);
      if(b)hitBoss(2);break;
    case 'slow':G.slowT=5;break;
  }
  G.cds[id]=powerCd(id);sfx('power');
}

/* ---------- przeciwnicy ---------- */
function dmgEnemy(e,n){
  if(!e.alive)return;e.hp-=n;e.flash=.15;
  if(e.hp<=0){e.alive=false;burst(e.x+e.w/2,e.y+e.hy+e.h/2,enemyColor(e.skin),14);if(!e.minion)addCoins(1,e.x+e.w/2,e.y);sfx('stomp')}
  else sfx('hit');
}
function updEnemies(dt){
  const L=G.L,p=G.p,ts=G.slowT>0?.45:1,sp=D().speed;
  const mb=p.atkT>0?meleeBox():null;
  for(const e of L.enemies){
    if(!e.alive)continue;e.flash-=dt;
    if(!L.arena&&Math.abs(e.x-p.x)>1150)continue;
    if(e.frozen>0)e.frozen-=dt;
    else{const d=dt*ts;e.t+=d;
      switch(e.k){
        case 'walker':case 'hopper':
          e.x+=e.dir*e.sp*sp*d;if(e.x<e.x0){e.x=e.x0;e.dir=1}if(e.x>e.x1){e.x=e.x1;e.dir=-1}
          if(e.k==='hopper')e.hy=-Math.abs(Math.sin(e.t*3.2))*38;break;
        case 'flyer':case 'swimmer':case 'jelly':{const ox=e.x;const f=e.k==='jelly'?.6:1.1;
          e.x=e.cx+Math.sin(e.t*f)*e.range;e.y=e.cy+Math.sin(e.t*2.2)*(e.k==='jelly'?40:22);if(e.x!==ox)e.dir=e.x>ox?1:-1;break}
        case 'shooter':
          e.dir=p.x<e.x?-1:1;e.cool-=d;
          if(e.cool<=0&&Math.abs(p.x-e.x)<520){e.cool=2.8/sp;const a=Math.atan2(p.y+20-(e.y+12),p.x-e.x);
            G.eproj.push({x:e.x+e.w/2,y:e.y+12,vx:Math.cos(a)*230*sp,vy:Math.sin(a)*230*sp,r:8,col:WORLDS[L.wi].spike,life:4})}
          break;
      }}
    const hb={x:e.x+3,y:e.y+e.hy+3,w:e.w-6,h:e.h-4};
    if(overlap(p,hb)&&!G.over){
      if(p.vy>60&&p.y+p.h-hb.y<20){dmgEnemy(e,2);p.vy=-JUMPV*.7;p.jumps=1;sfx('stomp')}
      else if(p.dash>0)dmgEnemy(e,1);
      else if(e.frozen<=0)hurt(D().dmg,e.x+e.w/2);
    }
    if(mb&&!p.hitSet.has(e)&&overlap(mb,hb)){p.hitSet.add(e);dmgEnemy(e,meleeDmg());
      if(e.alive&&(e.k==='walker'||e.k==='hopper'))e.x=clamp(e.x+p.dir*40,e.x0,e.x1)}
  }
}

/* ---------- pociski ---------- */
function hitsSolid(x,y,L){for(const s of L.solids)if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;return false}
function updProj(dt){
  const L=G.L,b=G.boss&&!G.boss.dead?G.boss:null;
  for(const q of G.proj){
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
    if(q.fire&&Math.random()<.6)addPart(q.x,q.y,'#ffb347',1,.3);
    if(hitsSolid(q.x,q.y,L)){q.life=0;burst(q.x,q.y,q.col,6);continue}
    const c={x:q.x-q.r,y:q.y-q.r,w:q.r*2,h:q.r*2};
    for(const e of L.enemies){if(!e.alive)continue;if(overlap(c,{x:e.x,y:e.y+e.hy,w:e.w,h:e.h})){dmgEnemy(e,q.dmg);if(q.freeze&&e.alive)e.frozen=q.freeze;q.life=0;burst(q.x,q.y,q.col,8);break}}
    if(q.life>0&&b&&b.alpha>.5&&overlap(c,b)){hitBoss(q.dmg);if(q.freeze)b.frozen=1.4;q.life=0;burst(q.x,q.y,q.col,10)}
  }
  G.proj=G.proj.filter(q=>q.life>0&&q.x>G.cam-100&&q.x<G.cam+W+100);
  const ts=G.slowT>0?.45:1,p=G.p;
  for(const q of G.eproj){
    q.x+=q.vx*dt*ts;q.y+=q.vy*dt*ts;q.life-=dt;if(q.g)q.vy+=q.g*dt*ts;
    if(hitsSolid(q.x,q.y,L)){q.life=0;continue}
    if(overlap({x:q.x-q.r+2,y:q.y-q.r+2,w:q.r*2-4,h:q.r*2-4},p)){
      if(p.shield>0){q.life=0;burst(q.x,q.y,'#9fe8ff',6)}else if(p.inv<=0&&p.dash<=0){q.life=0;hurt(D().dmg,q.x)}}
  }
  G.eproj=G.eproj.filter(q=>q.life>0);
}

/* ---------- obiekty świata ---------- */
function updWorld(dt){
  const L=G.L,p=G.p,t=G.t;
  for(const m of L.movers){const ox=m.x,oy=m.y;m.t+=dt*m.sp;const f=.5-.5*Math.cos(m.t);
    if(m.ax==='x')m.x=m.a+(m.b-m.a)*f;else m.y=m.a+(m.b-m.a)*f;m.dx=m.x-ox;m.dy=m.y-oy}
  for(const c of L.crumbles){
    if(c.st===0&&p.gref===c){c.st=1;c.t=.45}
    else if(c.st===1){c.t-=dt;if(c.t<=0){c.st=2;c.vy=0}}
    else if(c.st===2){c.vy+=1400*dt;c.y+=c.vy*dt;if(c.y>H+60){c.st=3;c.t=2.6}}
    else if(c.st===3){c.t-=dt;if(c.t<=0){c.st=0;c.y=c.y0}}
  }
  const pb={x:p.x+4,y:p.y+4,w:p.w-8,h:p.h-6};
  for(const h of L.haz){
    if(h.x>p.x+700||h.x+h.w<p.x-700)continue;
    let active=false,box=h;
    switch(h.k){
      case 'spikes':case 'spikesDown':case 'urchin':active=true;break;
      case 'laser':case 'pop':active=((t+h.ph)%h.per)<h.on;break;
      case 'fireball':{const u=((t+h.ph)%h.per)/h.per;if(u<.62){const f=u/.62;h.y=h.base-(h.base-h.top)*4*f*(1-f);active=true}else h.y=H+40;break}
      case 'icicle':
        if(h.st===0&&Math.abs(p.x+p.w/2-(h.x+h.w/2))<80&&p.y>h.y){h.st=1;h.t=.35}
        else if(h.st===1){h.t-=dt;if(h.t<=0)h.st=2}
        else if(h.st===2){h.vy+=1500*dt;h.y+=h.vy*dt;active=true;if(h.y+h.h>=h.gy){h.st=3;h.t=3;burst(h.x+h.w/2,h.gy,'#dff6ff',10)}}
        else if(h.st===3){h.t-=dt;if(h.t<=0){h.st=0;h.y=h.y0;h.vy=0}}
        break;
      case 'lava':if(overlap(pb,h)){fallHurt();burst(p.x,p.y,'#ff7a1a',10)}break;
    }
    if(active&&overlap(pb,box))hurt(D().dmg,h.x+h.w/2);
  }

function pickAttack(b){

  let a=list[Math.floor(Math.random()*list.length)];
  if(a===b.last&&list.length>1)a=list[(list.indexOf(a)+1)%list.length];
  b.last=a;return a;
}
function execAttack(b,a){

    case 'vines':G.bfx.push({k:'vine',x:px-26,w:52,warn:.8,life:.8,t:0,hit:false});
      if(ph===2)G.bfx.push({k:'vine',x:clamp(px+(Math.random()<.5?-140:140),30,W-60),w:52,warn:1.1,life:.8,t:0,hit:false});break;
    case 'slam':b.vy=-980;b.air=true;b.tx=clamp(px-b.w/2,10,W-10-b.w);break;
    case 'charge':b.cdir=px<bx?-1:1;b.dir=b.cdir;if(b.fly)b.ty=clamp(p.y+p.h-b.h,90,FLOOR-b.h);break;
    case 'shoot':{const n=ph===2?5:3,a0=Math.atan2(p.y+p.h/2-by,px-bx),sp=250*D().speed;
      for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.2;G.eproj.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:b.wi===3?12:9,col,life:5})}break}
    case 'rain':{const n=5+ph*2;for(let i=0;i<n;i++){const x=i===0?px:30+Math.random()*(W-60);
      G.bfx.push({k:'rain',x,y:-40,vy:0,warn:.7+Math.random()*.6,life:3,t:0,col})}break}
    case 'wind':G.bfx.push({k:'wind',dir:px<bx?-1:1,t:0,life:2.4,warn:0});break;
    case 'whirl':G.bfx.push({k:'pull',t:0,life:2.2,warn:0});break;
    case 'summon':{const alive=G.L.enemies.filter(e=>e.alive&&e.minion).length;if(alive>=4)break;

        e.dir=px<x?-1:1;burst(x,FLOOR-20,'#fff',10)}break}

}
function actUpdate(b,a,d){
  const p=G.p;
  switch(a){
    case 'slam':
      b.vy+=2300*d;b.y+=b.vy*d;b.x=lerp(b.x,b.tx,Math.min(1,3*d));
      if(b.y>=FLOOR-b.h){b.y=FLOOR-b.h;b.air=false;G.shake=.35;sfx('boss');
        G.bfx.push({k:'shock',x:b.x-10,dir:-1,t:0,life:1.8,warn:0},{k:'shock',x:b.x+b.w-20,dir:1,t:0,life:1.8,warn:0});
        burst(b.x+b.w/2,FLOOR,'#bbb',16);return true}
      return false;
    case 'charge':{
      const sp=(b.phase===2?680:560)*D().speed;b.x+=b.cdir*sp*d;if(b.fly)b.y=lerp(b.y,b.ty,Math.min(1,4*d));
      if(Math.random()<.5)addPart(b.x+b.w/2,b.y+b.h-6,'#ddd',1,.4);
      if(b.x<10||b.x>W-10-b.w){b.x=clamp(b.x,10,W-10-b.w);G.shake=.3;sfx('hit');b.state='stun';b.t=0;return false}
      return false}
    case 'teleport':
      if(b.sub===0){b.alpha=Math.max(0,1-b.t/.4);if(b.t>.45){b.sub=1;const side=Math.random()<.5?-1:1;
        b.x=clamp(p.x+side*190-b.w/2,10,W-10-b.w);if(b.fly)b.y=clamp(p.y-40,90,FLOOR-b.h);b.t=0}}
      else if(b.sub===1){b.alpha=Math.min(1,b.t/.35);if(b.t>.4){b.sub=2;execAttack(b,b.wi===12&&Math.random()<.5?'spikes':'shoot');return true}}
      return false;
    case 'wind':{const shots=Math.floor(b.t/.8);if(shots>b.sub&&b.t<2.3){b.sub=shots;execAttack(b,'shoot')}return b.t>2.4}
    case 'whirl':return b.t>2.2;
    default:return b.t>.5;
  }
}
function updBoss(dt){
  const b=G.boss;if(!b)return;const p=G.p;
  b.flash-=dt;b.inv-=dt;
  if(b.dead){b.t+=dt;b.alpha=Math.max(0,1-b.t/1.2);return}
  if(b.frozen>0){b.frozen-=dt;return}
  const d=dt*(G.slowT>0?.5:1);b.t+=d;
  if(b.phase===1&&b.hp<=b.max/2){b.phase=2;G.banner={t:1.6,big:'Boss się wściekł!',small:'Uważaj — ataki są szybsze'};sfx('boss')}
  const spd=(b.phase===2?1.25:1)*D().speed,bx=b.x+b.w/2,px=p.x+p.w/2;
  if(b.state!=='act'||b.cur!=='charge')b.dir=px<bx?-1:1;
  switch(b.state){
    case 'intro':if(b.t>1.6){b.state='move';b.t=0}break;
    case 'move':
      if(b.fly){const tx=clamp(p.x+(bx>px?230:-230)-b.w/2+p.w/2,10,W-10-b.w);b.x=lerp(b.x,tx,Math.min(1,1.1*d));
        const ty=b.low?FLOOR-b.h-4:110+Math.sin(G.t*1.6)*40;b.y=lerp(b.y,ty,Math.min(1,2.2*d))}
      else{const dx=px-bx;if(Math.abs(dx)>100)b.x+=Math.sign(dx)*75*spd*d;b.x=clamp(b.x,10,W-10-b.w);b.y=FLOOR-b.h}
      if(b.t>(b.low?2.4:1.9/spd)){if(b.low){b.low=false;b.t=0;break}b.cur=pickAttack(b);b.state='tele';b.t=0}
      break;
    case 'tele':if(b.t>(b.phase===2?.55:.8)){execAttack(b,b.cur);b.state='act';b.t=0}break;
    case 'act':if(actUpdate(b,b.cur,d)){b.state='move';b.t=0;if(b.fly&&Math.random()<.65)b.low=true}break;
    case 'stun':if(b.fly)b.y=lerp(b.y,FLOOR-b.h-4,Math.min(1,3*d));if(b.t>1.4){b.state='move';b.t=0}break;
  }
  // kontakt
  const hb={x:b.x+10,y:b.y+10,w:b.w-20,h:b.h-14};
  if(b.alpha>.6&&overlap(p,hb)&&!G.over){
    if(p.vy>60&&p.y+p.h-hb.y<26){hitBoss(1);p.vy=-JUMPV*.8;p.jumps=1;sfx('stomp')}
    else if(p.dash<=0)hurt(D().dmg,bx);
  }
  if(p.atkT>0&&!p.hitSet.has(b)&&b.alpha>.5&&overlap(meleeBox(),hb)){p.hitSet.add(b);hitBoss(meleeDmg())}
}

      else{const k=Math.min(1,(f.t-f.warn)*8);for(let i=0;i<3;i++)tri(c,f.x+i*f.w/3,FLOOR,f.x+i*f.w/3+f.w/6,FLOOR-92*k+(i===1?0:18),f.x+(i+1)*f.w/3,FLOOR,f.col||'#58d15a')}break;
    case 'vine':if(!front)break;if(!on){c.fillStyle=`rgba(80,220,100,${.3+.3*Math.sin(G.t*20)})`;c.fillRect(f.x,FLOOR-6,f.w,6)}
      else{const k=Math.min(1,(f.t-f.warn)*6);c.strokeStyle='#2f8a2f';c.lineWidth=7;for(let i=0;i<3;i++){c.beginPath();c.moveTo(f.x+8+i*18,FLOOR);c.quadraticCurveTo(f.x+i*18+Math.sin(G.t*6+i)*14,FLOOR-60*k,f.x+10+i*16,FLOOR-110*k);c.stroke()}}break;
    case 'shock':if(!front)break;ell(c,f.x+15,FLOOR-12,18,14,'rgba(255,255,255,.35)');tri(c,f.x,FLOOR,f.x+15,FLOOR-28,f.x+30,FLOOR,'#d9d9d9');break;
    case 'rain':if(!on){c.fillStyle=`rgba(0,0,0,${.25+.15*Math.sin(G.t*20)})`;c.beginPath();c.ellipse(f.x,FLOOR-2,18,5,0,0,7);c.fill()}
      else{ell(c,f.x,f.y,15,15,'rgba(0,0,0,.25)');ell(c,f.x,f.y,12,12,f.col);ell(c,f.x-3,f.y-3,4,4,'rgba(255,255,255,.7)')}break;
    case 'hlaser':if(!on){if(Math.sin(G.t*30)>0){c.fillStyle='rgba(255,59,92,.35)';c.fillRect(0,f.y+f.h/2-2,W,4)}}

function drawHud(c){

   <p class="muted">Gdy stracisz wszystkie serca, świat zaczyna się od początku.</p>`,buttons:[{t:'Rozumiem',fn:back}]});
}

/* ---------- tworzenie bohatera ---------- */
let createMode='new';
function startCreate(){S=newSave();createMode='new';showCreate()}
function showCreate(){
  const L=S.look,isNew=createMode==='new';
  const sw=(key,arr)=>arr.map(c=>`<button class="sw ${L[key]===c?'on':''}" style="background:${c}" data-k="${key}" data-v="${c}" aria-label="kolor"></button>`).join('');
  const ch=(key,arr)=>arr.map(([v,n])=>`<button class="chip ${L[key]===v?'on':''}" data-k="${key}" data-v="${v}">${n}</button>`).join('');
  $('#scCreate').innerHTML=`<div class="create"><div class="preview"><canvas id="cvPrev" width="300" height="300"></canvas>
     <div style="margin-top:.4em;font-weight:800;font-size:1.3em" id="pvName">${esc(S.name)}</div><div class="muted">${CL().icon} ${CL().name}</div></div>
   <div class="opts"><h2>${isNew?'Stwórz bohatera':'Zmień wygląd'}</h2>
    <label class="cap" for="inName">Imię bohatera</label><input class="name" id="inName" maxlength="16" value="${esc(S.name)}">
    ${isNew?`<label class="cap">Postać</label><div class="cls">${Object.entries(CLASSES).map(([k,c])=>`<button class="clsCard ${S.cls===k?'on':''}" data-cls="${k}"><b>${c.icon} ${c.name}</b><small>${c.desc}</small></button>`).join('')}</div>`:''}
    <label class="cap">Kolor głowy</label><div class="chips">${sw('skin',SKINS)}</div>
    <label class="cap">Fryzura</label><div class="chips">${ch('hair',HAIRS)}</div>
    <label class="cap">Kolor włosów</label><div class="chips">${sw('hairC',HAIRC)}</div>
    <label class="cap">Twarz</label><div class="chips">${ch('face',FACES)}</div>
    <label class="cap">Koszulka</label><div class="chips">${sw('shirt',CLOTH)}</div>
    <label class="cap">Spodnie</label><div class="chips">${sw('pants',CLOTH)}</div>
    ${isNew?`<label class="cap">Poziom trudności</label><div class="chips">${DIFFS.map((d,i)=>`<button class="chip ${S.diff===i?'on':''}" data-diff="${i}" title="${d.desc}">${d.name}</button>`).join('')}</div>
      <p class="muted">${D().desc}</p>`:''}
    <div class="row" style="margin-top:.6em"><button class="btn big green" id="bGo">${isNew?'Rozpocznij przygodę':'Gotowe'}</button>${isNew?'<button class="btn dark" id="bBack">Wróć</button>':''}</div>
   </div></div>`;
  const el=$('#scCreate');
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{L[b.dataset.k]=b.dataset.v;keepScroll(showCreate)});
  el.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{S.cls=b.dataset.cls;keepScroll(showCreate)});
  el.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{S.diff=+b.dataset.diff;keepScroll(showCreate)});
  $('#inName').oninput=e=>{S.name=e.target.value.trim()||'Bohater';$('#pvName').textContent=S.name};
  $('#inName').onkeydown=e=>e.stopPropagation();
  $('#bGo').onclick=()=>{save();if(isNew)intro();else showMap()};
  if(isNew)$('#bBack').onclick=showTitle;
  showScreen('scCreate');
}
function keepScroll(fn){const el=document.querySelector('.screen.on'),y=el?el.scrollTop:0;fn();const e2=document.querySelector('.screen.on');if(e2)e2.scrollTop=y}
function intro(){
  showMsg({icon:'🌑',title:'Pan Cienia nadchodzi',html:`<p>Pan Cienia zamknął Świat 13 w mroku, a jego strażnicy pilnują dwunastu krain.</p>
   <p>Przejdź 12 światów po kolei, pokonaj ich bossów i zdobądź 12 Kryształów Zwycięstwa. Gdy zbierzesz wszystkie, otrzymasz <b>Legendarny Miecz</b>, który otworzy portal do Świata 13.</p>
   <p class="muted">Każdy świat daje Ci nową moc. Wszystkie moce prowadzą do zwycięstwa.</p>`,buttons:[{t:'Do przygody!',cls:'green',fn:()=>{S.seen=true;save();showMap()}}]});
}

/* ---------- mapa ---------- */
function unlocked(i){return i===12?S.sword:(i===0||S.done[i-1]||S.done[i])}
function nextWorld(){for(let i=0;i<12;i++)if(!S.done[i])return i;return S.sword&&!S.done[12]?12:-1}
function showMap(){
  running=false;setHud(false);
  const nx=nextWorld(),crystals=S.done.slice(0,12).filter(Boolean).length;
  const gems=WORLDS.slice(0,12).map((w,i)=>`<span class="gem" style="${S.done[i]?`background:${w.crystal}`:''}" title="${w.name}"></span>`).join('');
  const cards=WORLDS.map((w,i)=>{const lk=!unlocked(i),dn=S.done[i];
    return `<button class="wcard ${lk?'locked':''} ${i===nx?'next':''} ${i===12?'final':''}" data-w="${i}" style="background:linear-gradient(160deg,${w.sky[0]},${shade(w.sky[1].startsWith('#')?w.sky[1]:'#445566',-60)})">
     <span class="no">${i+1}</span><span class="ic">${w.icon}</span><b>${w.name}</b><small>${lk?(i===12?'Potrzebny Legendarny Miecz':'Zablokowany'):w.boss}</small>
     <span class="st">${lk?'🔒':dn?'💎':''}</span></button>`}).join('');
  $('#scMap').innerHTML=`<div class="mapTop"><div><h2>${esc(S.name)} ${S.champion?'<span class="badge">Strażnik 13 Światów</span>':''}</h2>
     <div class="row"><span class="coins">🪙 ${S.coins}</span><span class="gems" aria-label="Kryształy: ${crystals} z 12">${gems}</span><span class="muted">${crystals}/12</span>${S.sword?'<span>🗡️ Miecz Strażników</span>':''}</div></div>
     <div class="row"><button class="btn sm blue" id="bPw">Moce</button><button class="btn sm" id="bShop">Sklep</button><button class="btn sm green" id="bLook">Wygląd</button><button class="btn sm dark" id="bMenu">Menu</button></div></div>
   <div class="worlds">${cards}</div>
   <div class="row" style="margin-top:.8em"><span class="muted">Poziom trudności:</span>${DIFFS.map((d,i)=>`<button class="chip ${S.diff===i?'on':''}" data-diff="${i}" title="${d.desc}">${d.name}</button>`).join('')}</div>`;
  const el=$('#scMap');
  el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const i=+b.dataset.w;if(!unlocked(i)){sfx('hit');return}showLoadout(i)});
  el.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{S.diff=+b.dataset.diff;save();keepScroll(showMap)});
  $('#bPw').onclick=()=>showLoadout(-1);$('#bShop').onclick=showShop;$('#bLook').onclick=()=>{createMode='edit';showCreate()};$('#bMenu').onclick=showTitle;
  showScreen('scMap');
  menuWorld=nx>=0?nx:12;
}

/* ---------- wybór mocy ---------- */
function showLoadout(wi){
  const order=['orb',...WORLDS.map(w=>w.reward).filter(Boolean)];
  const from=id=>{const i=WORLDS.findIndex(w=>w.reward===id);return i>=0?WORLDS[i]:null};
  const w=wi>=0?WORLDS[wi]:null;
  $('#scLoadout').innerHTML=`<div class="spread"><div>${w?`<h2>${w.icon} Świat ${wi+1}: ${w.name}</h2><p class="muted">${w.motif} Boss: <b>${w.boss}</b>.</p>`:'<h2>Moce</h2>'}</div>
     <div class="coins">${S.loadout.length}/6 mocy</div></div>
   <p>Wybierz do 6 mocy, które zabierzesz do świata. Używasz ich klawiszami <kbd>1</kbd>–<kbd>6</kbd> albo przyciskami na dole ekranu.</p>
   <div class="grid3" style="margin-top:.5em">${order.map(id=>{const P=POWERS[id],own=S.powers.includes(id),n=S.loadout.indexOf(id);
     return own?`<button class="pw ${n>=0?'on':''}" data-p="${id}"><span class="e">${P.icon}</span><span><b>${n>=0?(n+1)+'. ':''}${P.name}</b><small>${P.desc}</small></span></button>`
      :`<div class="pw lock"><span class="e">❔</span><span><b>Nieznana moc</b><small>Pokonaj: ${from(id)?from(id).boss:'?'}</small></span></div>`}).join('')}</div>
   <div class="row" style="margin-top:.8em">${w?'<button class="btn big green" id="bStart">Do boju!</button>':''}<button class="btn dark" id="bLB">Wróć na mapę</button></div>`;
  $('#scLoadout').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const id=b.dataset.p,n=S.loadout.indexOf(id);
    if(n>=0)S.loadout.splice(n,1);else if(S.loadout.length<6)S.loadout.push(id);else{sfx('hit');return}save();keepScroll(()=>showLoadout(wi))});
  if(w)$('#bStart').onclick=()=>startWorld(wi);
  $('#bLB').onclick=showMap;
  showScreen('scLoadout');
}

/* ---------- sklep ---------- */
function showShop(){
  const cats=[['helmet','Hełmy'],['cape','Peleryny'],['armor','Zbroje'],['up','Ulepszenia']];
  const itemHtml=it=>{const own=!!S.owned[it.id],worn=it.cat!=='up'&&S.look[it.cat]===it.v;let btn;
    if(it.cat==='up')btn=own?'<span class="muted">Kupione ✓</span>':`<button class="btn sm" data-buy="${it.id}" ${S.coins<it.price?'disabled':''}>Kup za ${it.price} 🪙</button>`;
    else if(own)btn=`<button class="btn sm ${worn?'dark':'green'}" data-wear="${it.id}">${worn?'Zdejmij':'Załóż'}</button>`;
    else if(it.special)btn='<span class="muted">Nagroda za ukończenie gry</span>';
    else btn=`<button class="btn sm" data-buy="${it.id}" ${S.coins<it.price?'disabled':''}>Kup za ${it.price} 🪙</button>`;
    return `<div class="item ${worn?'on':''}"><b>${it.name}</b><small>${it.desc||(worn?'Założone':' ')}</small>${btn}</div>`};
  $('#scShop').innerHTML=`<div class="shopHead"><canvas id="cvShop" width="220" height="220"></canvas><div><h2>Sklep</h2><p class="muted">Monety zbierasz w światach i ze skrzyń. Nowe części wyglądu zakładasz od razu.</p></div>
    <div><div class="coins">🪙 ${S.coins}</div><button class="btn dark" id="bSB">Wróć na mapę</button></div></div>
    ${cats.map(([c,n])=>`<h3>${n}</h3><div class="grid4">${SHOP.filter(i=>i.cat===c).map(itemHtml).join('')}</div>`).join('')}`;
  const el=$('#scShop');
  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=SHOP.find(i=>i.id===b.dataset.buy);if(S.coins<it.price)return;
    S.coins-=it.price;S.owned[it.id]=true;if(it.cat!=='up')S.look[it.cat]=it.v;save();sfx('chest');keepScroll(showShop)});
  el.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{const it=SHOP.find(i=>i.id===b.dataset.wear);S.look[it.cat]=S.look[it.cat]===it.v?'':it.v;save();keepScroll(showShop)});
  $('#bSB').onclick=showMap;
  showScreen('scShop');
}

/* ---------- przebieg gry ---------- */
let lastWorld=0;
function startWorld(wi){
  lastWorld=wi;newRun(wi);running=true;paused=false;showScreen(null);setHud(true);buildPowerBar();
  for(const k in KEY)KEY[k]=0;for(const k in PRESS)delete PRESS[k];
}
function buildPowerBar(){const bar=$('#hudPowers');bar.innerHTML='';
  S.loadout.forEach((id,i)=>{const b=document.createElement('button');b.className='pb';b.title=POWERS[id].name;b.setAttribute('aria-label',POWERS[id].name);
    b.innerHTML=`<span class="k">${i+1}</span>${POWERS[id].icon}<span class="cd"></span>`;
    b.addEventListener('pointerdown',e=>{e.preventDefault();usePower(i)});bar.appendChild(b)})}
function updatePowerBar(){const bs=$('#hudPowers').children;
  S.loadout.forEach((id,i)=>{const b=bs[i];if(!b)return;const cd=G.cds[id]||0;b.lastChild.style.height=(cd/powerCd(id)*100)+'%';b.classList.toggle('ready',cd<=0)})}
function pauseGame(){
  if(!running||!G||G.over||G.victory)return;
  if(paused){resume();return}
  paused=true;for(const k in KEY)KEY[k]=0;
  showMsg({icon:'⏸️',title:'Pauza',html:`<p class="muted">Świat ${G.wi+1}: ${WORLDS[G.wi].name}</p>`,buttons:[
    {t:'Graj dalej',cls:'green',fn:resume},{t:'Zacznij świat od nowa',fn:()=>startWorld(G.wi)},
    {t:muted?'Włącz dźwięk':'Wyłącz dźwięk',cls:'dark',fn:()=>{muted=!muted;paused=false;pauseGame()}},{t:'Wróć na mapę',cls:'red',fn:showMap}]});
}
function resume(){paused=false;showScreen(null);last=performance.now()}
$('#pauseBtn').onclick=()=>pauseGame();
function onDeath(){
  running=false;setHud(false);save();
  showMsg({icon:'💥',title:'Ups! Zabrakło serc',html:`<p>Świat ${G.wi+1} zaczyna się od początku. Monety, które zebrałeś, zostają z Tobą!</p><p class="muted">Wskazówka: moce ${S.loadout.map(i=>POWERS[i].icon).join(' ')} ładują się same — używaj ich często.</p>`,
    buttons:[{t:'Spróbuj jeszcze raz',cls:'green',fn:()=>startWorld(G.wi)},{t:'Mapa',cls:'dark',fn:showMap}]});
}
function worldComplete(){
  const wi=G.wi,w=WORLDS[wi],first=!S.done[wi];
  running=false;setHud(false);S.done[wi]=true;jingle([523,659,784,1046]);
  let extra='';
  if(first){S.coins+=25;extra+='<p>Nagroda: <b>+25 🪙</b></p>';
    if(w.reward&&!S.powers.includes(w.reward)){S.powers.push(w.reward);if(S.loadout.length<6)S.loadout.push(w.reward);
      const P=POWERS[w.reward];extra+=`<p style="font-size:1.2em">Nowa moc: <b>${P.icon} ${P.name}</b></p><p class="muted">${P.desc}</p>`}}
  save();
  const crystals=S.done.slice(0,12).filter(Boolean).length;
  const next=()=>{if(crystals===12&&!S.sword){S.sword=true;save();jingle([392,523,659,784,1046,1318]);
      showMsg({icon:'🗡️',title:'Legendarny Miecz!',html:`<p>Zebrałeś wszystkie 12 Kryształów Zwycięstwa. Otrzymujesz <b>Miecz Strażników Światów</b>.</p><p>Twój cios jest teraz dużo silniejszy, a portal do Świata 13 właśnie się otworzył.</p>`,
        buttons:[{t:'Otwórz portal',cls:'green',fn:showMap}]})}else showMap()};
  showMsg({icon:`<span style="display:inline-block;width:1em;height:1.2em;clip-path:polygon(50% 0,100% 30%,80% 100%,20% 100%,0 30%);background:${w.crystal}"></span>`,
    title:`${w.boss} pokonany!`,html:`<p>Zdobywasz Kryształ Zwycięstwa świata <b>${w.name}</b> (${crystals}/12).</p>${extra}`,buttons:[{t:'Dalej',cls:'green',fn:next}]});
}
function ending(){
  running=false;setHud(false);S.done[12]=true;S.champion=true;['h_guard','c_guard','a_guard'].forEach(id=>S.owned[id]=true);S.coins+=100;save();
  jingle([523,659,784,1046,784,1046,1318]);
  showMsg({icon:'🏆',title:'Wszystkie światy uratowane!',html:`<p>Pan Cienia został pokonany, a wszystkie krainy są znowu wolne. ${esc(S.name)} otrzymuje tytuł <b>Strażnika 13 Światów</b>!</p>
    <p>Odblokowane w sklepie: Hełm Strażnika, Peleryna Strażnika i Złota zbroja Strażnika. Do tego +100 🪙.</p>
    <p class="muted">Każdy świat daje Ci nową moc. Wszystkie moce prowadzą do zwycięstwa.</p>`,
    buttons:[{t:'Zagraj ponownie trudniej',cls:'green',fn:ngPlus},{t:'Mapa',cls:'dark',fn:showMap}]});
}
function ngPlus(){
  showMsg({icon:'🔁',title:'Nowa przygoda',html:'<p>Przejdziesz wszystkie światy jeszcze raz. Zachowasz monety, wygląd i tytuł Strażnika, a moce zdobędziesz od nowa.</p><p>Wybierz poziom trudności:</p>',
    buttons:DIFFS.map((d,i)=>({t:d.name,cls:i>S.diff?'red':'dark',fn:()=>{S.diff=i;S.done=Array(13).fill(false);S.sword=false;S.powers=['orb'];S.loadout=['orb'];S.ng++;save();showMap()}})).concat([{t:'Wróć',cls:'dark',fn:showMap}])});
}

/* ================= PĘTLA GRY ================= */
function step(dt){
  const p=G.p;
  G.t+=dt;if(G.slowT>0)G.slowT-=dt;G.shake=Math.max(0,G.shake-dt);if(G.banner)G.banner.t-=dt;
  if(G.beam){G.beam.t-=dt;if(G.beam.t<=0)G.beam=null}
  for(const k in G.cds)G.cds[k]=Math.max(0,G.cds[k]-dt);
  if(G.over){G.endT-=dt;tickFx(dt);if(G.endT<=0)onDeath();for(const k in PRESS)delete PRESS[k];return}
  if(G.victory){G.endT-=dt;if(G.endT<=0){G.victory=false;ending();return}}
  updWorld(dt);updPlayer(dt);updEnemies(dt);updProj(dt);
  if(G.mode==='boss'){updBoss(dt);updBossFx(dt)}
  tickFx(dt);
  if(G.mode==='level'){const tx=clamp(p.x-W*.38,0,Math.max(0,G.L.end-W));G.cam=lerp(G.cam,tx,Math.min(1,9*dt))}else G.cam=0;
  for(const k in PRESS)delete PRESS[k];
}
function tickFx(dt){
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.life-=dt}G.parts=G.parts.filter(q=>q.life>0);
  if(G.parts.length>400)G.parts.splice(0,G.parts.length-400);
  for(const t of G.texts){t.y-=40*dt;t.t-=dt}G.texts=G.texts.filter(t=>t.t>0);
  for(const f of G.fx){f.t+=dt;if(f.k==='shard')f.y+=f.vy*dt}G.fx=G.fx.filter(f=>f.t<f.max);
}
let menuWorld=0,menuT=0;
function drawMenuBg(dt){
  menuT+=dt;const saved=G;
  G={cam:menuT*60,t:menuT};const L=baseLevel(menuWorld);
  drawBg(L);const w=WORLDS[menuWorld];
  drawSolid(ctx,{x:G.cam-100,y:440,w:W+200,h:200,k:'ground'},w);
  drawHero(ctx,W*.82,440,2.6,S?S.look:newSave().look,{dir:1,run:menuT*10,moving:true,cls:S?S.cls:'explorer',sword:S&&S.sword});
  if(L.dark){ctx.fillStyle=`rgba(5,0,20,${L.dark*.5})`;ctx.fillRect(0,0,W,H)}
  G=saved;
}
function drawPreviews(){
  for(const [id,s,yy] of [['cvPrev',5.2,285],['cvShop',3.6,205]]){const c2=document.getElementById(id);if(!c2||!c2.offsetParent)continue;
    const x=c2.getContext('2d');x.clearRect(0,0,c2.width,c2.height);
    x.fillStyle='rgba(255,255,255,.08)';x.beginPath();x.ellipse(c2.width/2,yy,70,12,0,0,7);x.fill();
    const t=performance.now()/1000;drawHero(x,c2.width/2,yy,s,S.look,{dir:Math.sin(t*.8)>0?1:-1,run:t*8,moving:false,cls:S.cls,sword:S.sword})}
}
let last=performance.now(),acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,Math.max(0,(ts-last)/1000));last=ts;
  try{
    if(running&&G&&!paused){acc+=dt;let n=0;while(acc>=1/60&&n<6){step(1/60);acc-=1/60;n++}if(running&&G)render();if(running)updatePowerBar()}
    else if(running&&G&&paused){render()}
    else{acc=0;drawMenuBg(dt);drawPreviews()}
  }catch(err){console.error(err)}
}
S=loadSave()||null;
if(!S){S=newSave()}
showTitle();
requestAnimationFrame(frame);

</script>
